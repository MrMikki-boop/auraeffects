name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JSON
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const files = ["module.json", ...fs.readdirSync("lang").filter(f => f.endsWith(".json")).map(f => `lang/${f}`)];
          for (const file of files) {
            JSON.parse(fs.readFileSync(file, "utf8"));
            console.log(`ok ${file}`);
          }
          NODE

      - name: Check JavaScript syntax
        run: find scripts -name "*.mjs" -print0 | xargs -0 -n1 node --check

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          MODULE_VERSION="$(node -p "require('./module.json').version")"
          TAG_VERSION="$GITHUB_REF_NAME"
          if [ "$MODULE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match module.json version $MODULE_VERSION"
            exit 1
          fi
          node - <<'NODE'
          const manifest = require("./module.json");
          const expectedDownload = `/releases/download/${manifest.version}/module.zip`;
          if (!manifest.download?.includes(expectedDownload)) {
            console.error(`module.json download must include ${expectedDownload}`);
            process.exit(1);
          }
          const expectedChangelog = `/releases/tag/${manifest.version}`;
          if (!manifest.changelog?.includes(expectedChangelog)) {
            console.error(`module.json changelog must include ${expectedChangelog}`);
            process.exit(1);
          }
          NODE

  release:
    name: Build release archive
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module.zip
        run: |
          mkdir -p dist
          zip -r dist/module.zip module.json README.md LICENSE lang packs scripts styles templates \
            -x "packs/**/LOCK" \
            -x "packs/**/LOG" \
            -x "packs/**/*.log" \
            -x "packs/**/LOG.old"
          cp module.json dist/module.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: auraeffects-release
          path: |
            dist/module.json
            dist/module.zip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/module.json
            dist/module.zip
